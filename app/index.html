<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanças da Casa</title>
  <meta name="description" content="Controle financeiro da casa com Open Finance e notas fiscais">
  <meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)" data-padrao="#F4F3EF">
  <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" data-padrao="#0B0B0C">
  <meta name="theme-color" content="#0B0B0C" data-padrao="#0B0B0C">
  <script>/* tema escolhido neste aparelho (Mais → Aparência), aplicado antes de pintar a tela */
    try { var t = localStorage.getItem("tema"); if (t === "claro" || t === "escuro") { document.documentElement.dataset.theme = t === "claro" ? "light" : "dark";
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === "claro" ? "#F4F3EF" : "#0B0B0C"; }); } } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/dolar-192.png">
  <link rel="apple-touch-icon" href="icons/dolar-192.png">
  <link rel="preload" href="fonts/space-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="offline" hidden></div>
  <div id="app"><div class="carregando-tela"><div class="spinner"></div></div></div>
  <nav id="abas" hidden>
    <button data-aba="inicio"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button data-aba="gastos"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span>Extrato</span></button>
    <button id="botaoAdicionar" class="aba-central" aria-label="Adicionar: escanear nota, lançar gasto ou receita" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Adicionar</span></button>
    <button data-aba="metas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Metas</span></button>
    <button data-aba="mais"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Mais</span></button>
  </nav>
  <div id="folha" hidden></div>
  <div id="aviso" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
