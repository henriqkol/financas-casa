<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="theme-color" content="#0f6e56" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1714" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="app"><div class="carregando-tela"><div class="spinner"></div></div></div>
  <nav id="abas" hidden>
    <button data-aba="inicio"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>

  <div id="folha" hidden></div>
  <div id="aviso" hidden></div>
  <script type="module" src="app.js"></script>
